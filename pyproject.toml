[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "parch-driver-manager"
version = "1.1.0"
description = "A modern driver management tool for Arch-based distributions"
readme = "README.md"
license = {text = "GPL-3.0-only"}
requires-python = ">=3.9"
dependencies = [
    "PyGObject>=3.42.0",
]

[project.urls]
Homepage = "https://github.com/parchlinux/Parch-Driver-Manager"

[project.scripts]
parch-driver-manager = "parch_driver_manager.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"parch_driver_manager" = ["py.typed", "locale/**/*.mo"]
