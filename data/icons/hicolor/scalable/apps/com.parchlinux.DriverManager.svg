<svg width="512" height="512" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="parchPlate" x1="64" y1="8" x2="64" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#00FF95"/>
      <stop offset="0.5" stop-color="#00A9FF"/>
      <stop offset="1" stop-color="#0080FF"/>
    </linearGradient>
  </defs>

  <!-- squircle base plate -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#parchPlate)"/>

  <!-- chip pins: top -->
  <rect x="46" y="26" width="6" height="14" rx="2" fill="white"/>
  <rect x="61" y="26" width="6" height="14" rx="2" fill="white"/>
  <rect x="76" y="26" width="6" height="14" rx="2" fill="white"/>

  <!-- chip pins: bottom -->
  <rect x="46" y="88" width="6" height="14" rx="2" fill="white"/>
  <rect x="61" y="88" width="6" height="14" rx="2" fill="white"/>
  <rect x="76" y="88" width="6" height="14" rx="2" fill="white"/>

  <!-- chip pins: left -->
  <rect x="26" y="46" width="14" height="6" rx="2" fill="white"/>
  <rect x="26" y="61" width="14" height="6" rx="2" fill="white"/>
  <rect x="26" y="76" width="14" height="6" rx="2" fill="white"/>

  <!-- chip pins: right -->
  <rect x="88" y="46" width="14" height="6" rx="2" fill="white"/>
  <rect x="88" y="61" width="14" height="6" rx="2" fill="white"/>
  <rect x="88" y="76" width="14" height="6" rx="2" fill="white"/>

  <!-- chip body -->
  <rect x="40" y="40" width="48" height="48" rx="10" fill="white"/>

  <!-- chip core mark, cut from body for contrast -->
  <rect x="56" y="56" width="16" height="16" rx="4" fill="#0080FF"/>
</svg>
